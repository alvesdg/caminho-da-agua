<!DOCTYPE html>
<html lang="pt-BR">
<head>

        <span class="logo-texto">CAMINHO DA ÁGUA</span>

    <!-- Botão hambúrguer (só aparece em mobile via CSS) -->

        <span></span><span></span><span></span>
    </button>

    <nav>

        <a href="sobre.html">Sobre</a>
        <a href="login.html">Login</a>

                <span class="contato-icon">📸</span>

            </div>
            
        </div>
        <img class="contato-img"
             src="../img/pathWater.png"
             alt="Pessoa recebendo água limpa">

                Enviar mensagem
        </button>

<footer>

        <img class="footer-logo-img" src="../img/noNameLogo.png" alt="Logo Caminho da Água">

    <div class="footer-links">
