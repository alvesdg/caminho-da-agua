<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💧 Login - Caminho da Água</title>

    <!-- CSS -->
    <link rel="stylesheet" href="assets/style.css">

</head>
<body>

    <!-- MENU -->
    <header>
        <div class="logo">💧Caminho da Água</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="#">Sobre</a>
            <a href="#">Login</a>
            <a href="#">Cadastro</a>
            <button class="btn">Criar Doação</button>
        </nav>
    </header>

    <!-- LOGIN -->
    <section class="login-container">

        <div class="login-box">

            <!-- FOTO -->
            <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Usuário">

            <!-- INPUTS -->
            <div>
                <input type="email" placeholder="Email">
            </div>

            <div>
                <input type="password" placeholder="Senha">
            </div>

            <!-- BOTÃO -->
            <button class="btn login-btn">Login</button>
            <br>
            <br>
            <a href="#">Não tem conta ? Registre-se</a>
            <!-- TEXTO -->
            <p class="linha">──── Ou entre com ────</p>

            <!-- REDES -->
            <div class="social">

                <button>
                    <img src="https://cdn-icons-png.flaticon.com/512/0/747.png" alt="Apple">
                    <br>Apple
                </button>

                <button>
                    <img src="https://cdn-icons-png.flaticon.com/512/300/300221.png" alt="Google">
                    <br>Google
                </button>

                <button>
                    <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="Facebook">
                    <br>Facebook
                </button>

            </div>

        </div>

    </section>

    <!-- FOOTER -->
<footer>
    <p>© 2026 Caminho da Agua</p>
</footer>

</body>
</html>
